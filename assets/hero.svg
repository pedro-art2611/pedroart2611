<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Artur — Software Engineering Intern</title>
  <desc id="desc">Banner cyberpunk japonês com uma katana luminosa e texto de apresentação profissional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset="0.6" stop-color="#111827"/>
      <stop offset="1" stop-color="#3B0A0A"/>
    </linearGradient>
    <linearGradient id="blade" x1="300" y1="20" x2="1050" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#BAE6FD"/>
      <stop offset="0.7" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#22D3EE" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <path d="M0 302H1200" stroke="#DC2626" stroke-opacity=".45"/>
  <path d="M0 305H410" stroke="#22D3EE" stroke-width="2"/>

  <g opacity=".55" fill="#22D3EE">
    <circle cx="1030" cy="72" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="125" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="250" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="rotate(-23 830 182)" filter="url(#glow)">
    <path d="M420 182H1030" stroke="url(#blade)" stroke-width="5" stroke-linecap="round"/>
    <path d="M420 182H1030" stroke="#E0F2FE" stroke-opacity=".35" stroke-width="14" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values=".08;.5;.08" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M400 162L445 202" stroke="#DC2626" stroke-width="12" stroke-linecap="round"/>
    <path d="M380 150L420 190" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="82" y="100" fill="#22D3EE" font-size="16" letter-spacing="4">PEDRO ARTUR / SOFTWARE ENGINEERING</text>
    <text x="78" y="172" fill="#F8FAFC" font-size="58" font-weight="700">BUILD WITH INTENT.</text>
    <text x="82" y="212" fill="#CBD5E1" font-size="20">Estagiário em Engenharia de Software · Rio de Janeiro, BR</text>
    <text x="82" y="265" fill="#DC2626" font-size="18">&gt; sistemas · IA aplicada · automações<span fill="#22D3EE">_</span>
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
