<svg width="1200" height="118" viewBox="0 0 1200 118" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Corte de katana animado</title>
  <desc id="desc">Uma katana tradicional atravessa a tela, deixando uma marca vermelha de tinta.</desc>
  <defs>
    <linearGradient id="slash" x1="80" y1="100" x2="850" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7F1D1D" stop-opacity="0"/>
      <stop offset=".25" stop-color="#991B1B"/>
      <stop offset=".8" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <path d="M28 91C230 76 392 58 566 54C773 48 974 58 1172 31" stroke="#A8A29E" stroke-opacity=".55" stroke-width="2" stroke-dasharray="2 13"/>
  <g>
    <path d="M-140 112L760 14" stroke="url(#slash)" stroke-width="18" stroke-linecap="round" opacity=".35" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" from="-900 0" to="1480 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M-140 112L760 14" stroke="url(#slash)" stroke-width="5" stroke-linecap="round" stroke-dasharray="720 1200">
      <animate attributeName="stroke-dashoffset" from="720" to="-1200" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(-250 15) rotate(-7 250 42)">
    <path d="M70 62L470 11" stroke="#FAFAF9" stroke-width="7" stroke-linecap="round"/>
    <path d="M72 66L470 15" stroke="#57534E" stroke-width="2" stroke-linecap="round"/>
    <path d="M57 49L86 77" stroke="#292524" stroke-width="15" stroke-linecap="round"/>
    <path d="M42 37L76 70" stroke="#991B1B" stroke-width="7" stroke-linecap="round"/>
    <circle cx="72" cy="63" r="17" stroke="#B45309" stroke-width="5"/>
    <path d="M52 45L30 25M62 40L52 16M76 38L80 12" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" from="-180 0" to="1500 0" dur="2.4s" repeatCount="indefinite"/>
  </g>
</svg>
