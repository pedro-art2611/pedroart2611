<svg width="1200" height="96" viewBox="0 0 1200 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Corte de katana animado</title>
  <desc id="desc">Uma katana atravessa a tela e deixa um traço de tinta vermelha.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="48" x2="1200" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7F1D1D" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#B91C1C"/>
      <stop offset="0.72" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#7F1D1D" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <path d="M24 52C230 48 380 60 540 47C720 33 900 51 1176 44" stroke="#D6D3D1" stroke-opacity=".6" stroke-width="2" stroke-dasharray="5 12"/>
  <path d="M-120 80L380 18" stroke="url(#ink)" stroke-width="12" stroke-linecap="round" opacity=".28" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" from="-580 0" to="1500 0" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <path d="M-120 80L380 18" stroke="url(#ink)" stroke-width="4" stroke-linecap="round" stroke-dasharray="540 960">
    <animate attributeName="stroke-dashoffset" from="540" to="-960" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(-220 0) rotate(-7 220 48)">
    <path d="M30 53L410 5" stroke="#F5F5F4" stroke-width="5" stroke-linecap="round"/>
    <path d="M28 53L410 5" stroke="#292524" stroke-width="1" stroke-linecap="round"/>
    <path d="M15 42L52 70" stroke="#991B1B" stroke-width="12" stroke-linecap="round"/>
    <path d="M4 35L29 54" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" from="-200 15" to="1500 15" dur="2.2s" repeatCount="indefinite"/>
  </g>
</svg>
