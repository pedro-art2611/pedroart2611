<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pergaminho de atividade com dragão animado</title>
  <desc id="desc">Uma grade de contribuições em tons de vermelho e dourado com um dragão de tinta percorrendo o caminho.</desc>
  <defs>
