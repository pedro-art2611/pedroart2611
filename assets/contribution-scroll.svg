  <text x="54" y="45" fill="#7F1D1D" font-family="Georgia, serif" font-size="19" font-weight="700">PERGAMINHO DE ATIVIDADE</text>
  <text x="1146" y="45" text-anchor="end" fill="#7F1D1D" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">PEDRO ARTUR</text>

